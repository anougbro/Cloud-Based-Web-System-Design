[project]
name = "pocketwise-api"
version = "1.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
omit = ["alembic/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "ARG", "PTH"]
ignore = ["S101", "TID252"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S311"]
"scripts/*" = ["T201"]
# "bearer" is the OAuth 2.0 token type from the spec, not a credential.
"app/schemas.py" = ["S105"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false