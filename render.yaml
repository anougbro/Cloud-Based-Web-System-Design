# Render Blueprint.
#
# Deploy with: connect this repository in the Render dashboard and apply the
# blueprint, or use `render blueprint launch`.
#
# The `databases[].plan: free` below is a 30-day trial. Render deletes a free
# PostgreSQL instance after 30 days of inactivity, which takes the API down
# with a "database does not exist" error. Switch to a paid plan (starter,
# 7 USD/month) for a durable deployment.

databases:
  - name: pocketwise-db
    plan: free
    databaseName: pocketwise
    postgresMajorVersion: "16"

services:
  - type: web
    name: pocketwise-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pocketwise-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://pocketwise-web.onrender.com
      - key: ALLOWED_HOSTS
        value: pocketwise-api.onrender.com

  - type: web
    name: pocketwise-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pocketwise-api.onrender.com