# Render Blueprint.
#
# Deploy with: connect this repository in the Render dashboard and apply the
# blueprint, or use `render blueprint launch`.
#
# The database is NOT provisioned by this blueprint. Render's free tier allows
# only one free Postgres instance per workspace, and the connection string it
# generates does not survive the blueprint's YAML rendering when the generated
# password contains URL-reserved characters. `DATABASE_URL` is therefore
# supplied manually (`sync: false`), which also makes the service deployable
# against any managed Postgres -- Neon, Supabase, or a paid Render instance.
#
# Migrations are applied by the container entrypoint before Uvicorn starts, so
# the schema is correct on first boot whatever the database state.

services:
  - type: web
    name: pocketwise-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://pocketwise-web.onrender.com
      # ALLOWED_HOSTS is intentionally absent. When it is empty,
      # app/main.py skips TrustedHostMiddleware entirely; when it is set, a
      # mismatch between the value and the hostname Render actually assigned
      # makes every request return 400. Set it to the real hostname once the
      # service exists -- it is a hardening step, not a functional one.
      #   ALLOWED_HOSTS: pocketwise-api.onrender.com

  - type: web
    name: pocketwise-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Render appends a suffix when the preferred service name is taken.
        # This must match the API's real hostname or the SPA hangs on login.
        value: https://pocketwise-api-5p3j.onrender.com